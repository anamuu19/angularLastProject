<!-- New Header for Admin Dashboard -->
<header class="admin-header">
  <h1>Welcome to Admin Dashboard</h1>
</header>

<div class="container pt-5" style="padding-top: 100px; margin-top: 100px;">
  <!-- Centering the Card Section -->
  <div class="row justify-content-center mb-4">
    <div class="col-md-4 mb-3">
      <div class="card card-body d-flex flex-row align-items-center">
        <div class="icon-green-bg d-flex justify-content-center align-items-center" style="width: 80px; height: 80px; border-radius: 40px;">
          <i class="fa fa-users text-white" style="font-size: 30px;"></i>
        </div>
        <div class="ms-4">
          <p>Total users</p>
          <h3 class="mb-0">{{register}}</h3>
        </div>
      </div>
    </div>
    <div class="col-md-4 mb-3">
      <div class="card card-body d-flex flex-row align-items-center">
        <div class="icon-green-bg d-flex justify-content-center align-items-center" style="width: 80px; height: 80px; border-radius: 40px;">
          <i class="fa fa-building text-white" style="font-size: 30px;"></i>
        </div>
        <div class="ms-4">
          <p>Total institution</p>
          <h3 class="mb-0">{{inst}}</h3>
        </div>
      </div>
    </div>
    <div class="col-md-4 mb-3">
      <div class="card card-body d-flex flex-row align-items-center">
        <div class="icon-green-bg d-flex justify-content-center align-items-center" style="width: 80px; height: 80px; border-radius: 40px;">
          <i class="fa fa-user-tie text-white" style="font-size: 30px;"></i>
        </div>
        <div class="ms-4">
          <p>Total manager</p>
          <h3 class="mb-0">{{hr}}</h3>
        </div>
      </div>
    </div>

    <!-- New Card for Request -->
    <div class="col-md-4 mb-3">
      <div class="card card-body d-flex flex-row align-items-center">
        <div class="icon-green-bg d-flex justify-content-center align-items-center" style="width: 80px; height: 80px; border-radius: 40px;">
          <i class="fa fa-file-alt text-white" style="font-size: 30px;"></i>
        </div>
        <div class="ms-4">
          <p>Total request</p>
          <h3 class="mb-0">{{request}}</h3>
        </div>
      </div>
    </div>
  </div>
</div>
