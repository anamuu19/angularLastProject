<div class="settings-container">
  <h2>Admin Settings</h2>

  <form [formGroup]="settingsForm" (ngSubmit)="onSubmit()">
    <!-- General Settings -->
    <div class="settings-section">
      <h3>General Settings</h3>

      <div class="form-row">
        <div class="form-group col-md-6">
          <label for="appTitle">Application Title</label>
          <input id="appTitle" formControlName="appTitle" class="form-control" placeholder="Enter application title" />
        </div>

        <div class="form-group col-md-6">
          <label for="theme">Theme</label>
          <select id="theme" formControlName="theme" class="form-control">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
      </div>
    </div>

    <!-- User Management -->
    <div class="settings-section">
      <h3>User Management</h3>

      <div class="form-row">
        <div class="form-group col-md-6">
          <label for="maxUsers">Maximum Users</label>
          <input id="maxUsers" formControlName="maxUsers" type="number" class="form-control" placeholder="Enter maximum number of users" />
        </div>

        <div class="form-group col-md-6">
          <label for="userRoles">Default User Role</label>
          <select id="userRoles" formControlName="userRoles" class="form-control">
            <option value="user">User</option>
            <option value="admin">Admin</option>
            <option value="superadmin">Super Admin</option>
          </select>
        </div>
      </div>
    </div>

    <!-- System Settings -->
    <div class="settings-section">
      <h3>System Settings</h3>

      <div class="form-row">
        <div class="form-group col-md-6">
          <label for="autoBackup">Enable Auto Backup</label>
          <input id="autoBackup" type="checkbox" formControlName="autoBackup" />
        </div>

        <div class="form-group col-md-6">
          <label for="backupInterval">Backup Interval (in days)</label>
          <input id="backupInterval" formControlName="backupInterval" type="number" class="form-control" placeholder="Enter backup interval" />
        </div>
      </div>
    </div>

    <button type="submit" >Save Changes</button>
  </form>
</div>
