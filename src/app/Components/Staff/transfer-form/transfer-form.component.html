<div class="container mt-5">
  <div class="row mb-3">
    <div class="col-sm-12">
      <h2><b>Transfer Form</b></h2>
    </div>
  </div>
  <form [formGroup]="transferForm" (ngSubmit)="onSubmit()">
    <div class="row">
      <div class="col-md-4">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input type="text" class="form-control small-form-control" id="firstName" formControlName="firstName" />
          <div *ngIf="transferForm.get('firstName')?.invalid && (transferForm.get('firstName')?.dirty || transferForm.get('firstName')?.touched)">
            <small class="text-danger">First name is required.</small>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label for="middleName">Middle Name</label>
          <input type="text" class="form-control small-form-control" id="middleName" formControlName="middleName" />
          <div *ngIf="transferForm.get('middleName')?.invalid && (transferForm.get('middleName')?.dirty || transferForm.get('middleName')?.touched)">
            <small class="text-danger">Middle name is required.</small>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input type="text" class="form-control small-form-control" id="lastName" formControlName="lastName" />
          <div *ngIf="transferForm.get('lastName')?.invalid && (transferForm.get('lastName')?.dirty || transferForm.get('lastName')?.touched)">
            <small class="text-danger">Last name is required.</small>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" class="form-control small-form-control" id="email" formControlName="email" />
          <div *ngIf="transferForm.get('email')?.invalid && (transferForm.get('email')?.dirty || transferForm.get('email')?.touched)">
            <small class="text-danger">Valid email is required.</small>
          </div>
        </div>
        <div class="form-group">
          <label for="phoneNumber">Telephone</label>
          <input type="tel" class="form-control small-form-control" id="phoneNumber" formControlName="phoneNumber" />
          <div *ngIf="transferForm.get('phoneNumber')?.invalid && (transferForm.get('phoneNumber')?.dirty || transferForm.get('phoneNumber')?.touched)">
            <small class="text-danger">Telephone number is required.</small>
          </div>
        </div>
        <div class="form-group">
          <label for="address">Address</label>
          <input type="text" class="form-control small-form-control" id="address" formControlName="address" />
          <div *ngIf="transferForm.get('address')?.invalid && (transferForm.get('address')?.dirty || transferForm.get('address')?.touched)">
            <small class="text-danger">Address is required.</small>
          </div>
        </div>
        <div class="form-group">
          <label for="gender">Gender</label>
          <div>
            <label class="radio-inline">
              <input type="radio" formControlName="gender" value="Male" /> Male
            </label>
            <label class="radio-inline" style="margin-left: 15px;">
              <input type="radio" formControlName="gender" value="Female" /> Female
            </label>
          </div>
          <div *ngIf="transferForm.get('gender')?.invalid && (transferForm.get('gender')?.dirty || transferForm.get('gender')?.touched)">
            <small class="text-danger">Gender is required.</small>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label for="currentInstitution">Current Institution</label>
          <input type="text" class="form-control small-form-control" id="currentInstitution" formControlName="current_institution" />
          <div *ngIf="transferForm.get('current_institution')?.invalid && (transferForm.get('current_institution')?.dirty || transferForm.get('current_institution')?.touched)">
            <small class="text-danger">Current institution is required.</small>
          </div>
        </div>
        <div class="mb-3">
  <label for="desiredInstitution">Desired Institution</label>
  <select class="form-control small-form-control" id="desiredInstitution" formControlName="institution">
    <option value="" disabled>-- Choose Institution --</option>
    <option *ngFor="let a of instlist" [ngValue]="a"> <!-- Bind to the entire object -->
      {{ a.name }}
    </option>
  </select>
  <div *ngIf="transferForm.get('institution')?.invalid && (transferForm.get('institution')?.dirty || transferForm.get('institution')?.touched)">
    <small class="text-danger">Desired institution is required.</small>
  </div>
</div>

        <div class="form-group">
          <label for="date">Date of Submitting</label>
          <input type="date" class="form-control small-form-control" id="date" formControlName="date" />
          <div *ngIf="transferForm.get('date')?.invalid && (transferForm.get('date')?.dirty || transferForm.get('date')?.touched)">
            <small class="text-danger">Date is required.</small>
          </div>
        </div>
        <div class="form-group">
          <label for="reasonForTransfer">Reasons for Transfer</label>
          <textarea class="form-control small-form-control" id="reasonForTransfer" formControlName="reason_for_transfer"></textarea>
          <div *ngIf="transferForm.get('reason_for_transfer')?.invalid && (transferForm.get('reason_for_transfer')?.dirty || transferForm.get('reason_for_transfer')?.touched)">
            <small class="text-danger">Reason for transfer is required.</small>
          </div>
        </div>
      </div>
    </div>
    <div class="form-group">
      <button type="submit" class="btn btn-success" style="margin-right: 10px;">Submit</button>
      <button type="reset" class="btn btn-secondary">Reset</button>
    </div>
  </form>
</div>
